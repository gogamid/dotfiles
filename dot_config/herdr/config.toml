onboarding = false

[theme]
name = "terminal"

[terminal]
# Run new panes in zsh as a login shell, so both ~/.zprofile (brew shellenv)
# and ~/.zshrc (fnm, pnpm, cargo, go, ./node_modules/.bin) load. Without this
# herdr falls back to /bin/sh whenever $SHELL is unset, and bare command
# names like "lazygit" stop resolving.
default_shell = "/bin/zsh"
shell_mode = "login"

[keys]
prefix = "ctrl+space"

split_horizontal = "prefix+-"
split_vertical = "prefix+|"
close_tab = "prefix+x"
close_pane = "prefix+k"
new_tab = "prefix+c"
rename_tab = "prefix+r"

copy_mode = "prefix+space"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

previous_workspace = "prefix+p"
next_workspace = "prefix+n"

focus_agent = "ctrl+shift+1..9"

zoom = "prefix+shift+z"

[[keys.command]]
key = "shift+tab"
type = "shell"
command = "$HOME/.config/herdr/scripts/focus-next-done-agent.sh"
description = "Focus next done agent"

[[keys.command]]
key = "alt+tab"
type = "shell"
command = "herdr tab focus $(herdr tab list 2>&1 | jq -r '.result.tabs as $tabs | ($tabs[] | select(.focused).workspace_id) as $ws | [$tabs[] | select(.workspace_id == $ws)] as $ws_tabs | if $ws_tabs[0].focused then $ws_tabs[1].tab_id else $ws_tabs[0].tab_id end')"

[[keys.command]]
key = "prefix+l"
type = "popup"
width = "90%"
height = "90%"
command = "lazygit"
description = "Open Lazygit"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+h"
type = "pane"
command = "hunk diff"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "yazi"
description = "Open Yazi"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "Navigate left (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "Navigate down (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "Navigate up (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "Navigate right (Neovim/Herdr)"

[ui]
tab_bar_position = "bottom"
prompt_new_tab_name = false

agent_panel_sort = "spaces"
sidebar_collapsed_mode = "compact"

status_indicators = "symbols"
[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false
