gui:
  scrollHeight: 5
  nerdFontsVersion: "3"
  showFileIcons: true
git:
  diffRenderers:
    - command: 'hunk pager --theme {{if eq .colorScheme "light"}}github-light-default{{else}}github-dark-dimmed{{end}} --no-line-numbers --no-wrap --no-hunk-headers'
    - command: "delta --{{colorScheme}} --paging=never --file-decoration-style=none --hunk-header-decoration-style=none"
os:
  editInTerminal: true
  edit: 'nvim --server localhost:6666 --remote "$(realpath -- {{filename}})" && env -u NVIM nvim --server localhost:6666 --remote-ui'
  editAtLine: 'nvim --server localhost:6666 --remote "$(realpath -- {{filename}})" && nvim --server localhost:6666 --remote-send "{{line}}G" && env -u NVIM nvim --server localhost:6666 --remote-ui'
