gui:
  scrollHeight: 5
  nerdFontsVersion: "3"
  showFileIcons: true
git:
  diffRenderers:
    - command: 'hunk pager --theme {{if eq .colorScheme "light"}}github-light-default{{else}}github-dark-dimmed{{end}} --no-line-numbers --no-wrap --no-hunk-headers'
    - command: "delta --{{colorScheme}} --paging=never --file-decoration-style=none --hunk-header-decoration-style=none"
os:
  editPreset: "custom"
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
